name: CI

on:
  push:
    branches: [main, ui-redesign]
  pull_request:

jobs:
  backend:
    name: Backend build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build backend/QuizIn.Api/QuizIn.Api.csproj -c Release
      - name: Start the API and run the smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          cd backend/QuizIn.Api
          dotnet run -c Release --no-build --urls http://localhost:5080 > /tmp/api.log 2>&1 &
          ok=0
          for i in $(seq 1 40); do curl -sf http://localhost:5080/health && ok=1 && break; sleep 2; done
          if [ "$ok" != "1" ]; then echo "API did not start"; cat /tmp/api.log; exit 1; fi
          cd ../..
          bash backend/smoke-test.sh
      - name: API log
        if: always()
        run: cat /tmp/api.log || true

  app:
    name: App bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Bundle for Android (catches syntax and import errors)
        run: npx expo export --platform android
